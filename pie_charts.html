<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Data - Distribution Pie Charts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="movies_data.js"></script>
    <style>
        .chart-container { position: relative; height: 300px; width: 100%; display: flex; justify-content: center; }
        .table-container { max-height: 500px; overflow-y: auto; }
        thead th { position: sticky; top: 0; background: #f3f4f6; z-index: 10; }
    </style>
</head>
<body class="bg-gray-50 font-sans p-4 md:p-6 text-gray-800">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <div>
                <h1 class="text-2xl font-black text-gray-900 tracking-tight">Movies Data Pie Visualizer</h1>
                <p class="text-xs text-gray-500 mt-1">Country-responsive breakdowns across Platforms, Genres, Age Groups, and Ratings.</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex flex-col gap-1">
                    <label class="text-3xs font-bold uppercase text-gray-400">Filter by Country</label>
                    <select id="pie-country-select" onchange="filterByCountry(this.value)" class="text-xs bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 font-medium text-gray-800">
                        <option value="ALL">🌍 All Countries (Global)</option>
                    </select>
                </div>
                <button onclick="resetFilters()" class="text-xs mt-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-3 rounded-lg border border-gray-300 transition">
                    Reset
                </button>
            </div>
        </div>

        <!-- 2x2 Grid for Pie Charts -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- Chart 1: Platforms -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 id="title-platform" class="text-base font-bold text-center mb-3">Streaming Platforms Availability</h2>
                <div class="chart-container"><canvas id="platformChart"></canvas></div>
            </div>
            
            <!-- Chart 2: Genres -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 id="title-genre" class="text-base font-bold text-center mb-3">Top Movie Genres</h2>
                <div class="chart-container"><canvas id="genreChart"></canvas></div>
            </div>

            <!-- Chart 3: Age Groups -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 id="title-age" class="text-base font-bold text-center mb-3">Target Age Demographics</h2>
                <div class="chart-container"><canvas id="ageChart"></canvas></div>
            </div>

            <!-- Chart 4: Ratings -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 id="title-rating" class="text-base font-bold text-center mb-3">Rotten Tomatoes Quality Tiers</h2>
                <div class="chart-container"><canvas id="ratingChart"></canvas></div>
            </div>
        </div>

        <!-- Movie List Table -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-900" id="tableTitle">Filtered Titles (<span id="table-count">0</span>)</h2>
            </div>
            <div class="table-container border rounded-lg">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr>
                            <th class="p-3 border-b">Movie Title</th>
                            <th class="p-3 border-b">Year</th>
                            <th class="p-3 border-b">Age</th>
                            <th class="p-3 border-b">Rating</th>
                            <th class="p-3 border-b">Genres</th>
                            <th class="p-3 border-b">Platforms</th>
                            <th class="p-3 border-b">Country</th>
                        </tr>
                    </thead>
                    <tbody id="movieTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allMovies = window.MOVIES_DATA || [];
        let filteredMovies = [];
        let activeCountry = 'ALL';
        let charts = {};

        const colors = [
            '#ef4444', '#3b82f6', '#10b981', '#f59e0b', 
            '#8b5cf6', '#ec4899', '#14b8a6', '#6366f1',
            '#fb923c', '#06b6d4', '#84cc16', '#a855f7'
        ];

        document.addEventListener('DOMContentLoaded', () => {
            initCountrySelect();
            applySelection('ALL');
        });

        function initCountrySelect() {
            const sel = document.getElementById('pie-country-select');
            if (!sel || !allMovies) return;

            const counts = {};
            allMovies.forEach(m => {
                (m.countries || []).forEach(c => {
                    counts[c] = (counts[c] || 0) + 1;
                });
            });

            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
            let opts = `<option value="ALL">🌍 All Countries (Global - ${allMovies.length.toLocaleString()} Titles)</option>`;
            sorted.forEach(([c, cnt]) => {
                opts += `<option value="${c}">${c} (${cnt.toLocaleString()} titles)</option>`;
            });
            sel.innerHTML = opts;
        }

        function filterByCountry(country) {
            activeCountry = country;
            applySelection(country);
        }

        function applySelection(country) {
            if (country === 'ALL') {
                filteredMovies = allMovies;
            } else {
                const cLow = country.toLowerCase();
                filteredMovies = allMovies.filter(m => 
                    m.countries && m.countries.some(c => c.toLowerCase() === cLow)
                );
            }

            const suffix = country === 'ALL' ? 'Global Overview' : country;
            document.getElementById('title-platform').innerText = `Streaming Platforms — ${suffix}`;
            document.getElementById('title-genre').innerText = `Top Movie Genres — ${suffix}`;
            document.getElementById('title-age').innerText = `Target Age Demographics — ${suffix}`;
            document.getElementById('title-rating').innerText = `Rotten Tomatoes Quality Tiers — ${suffix}`;

            updateCharts();
            renderTable(filteredMovies);
        }

        function updateCharts() {
            let platformsCount = {};
            let genresCount = {};
            let agesCount = {};
            let ratingsCount = { 'High (80-100)': 0, 'Medium (60-79)': 0, 'Low (<60)': 0, 'Unrated': 0 };

            filteredMovies.forEach(m => {
                (m.platforms || []).forEach(p => { platformsCount[p] = (platformsCount[p] || 0) + 1; });
                (m.genres || []).forEach(g => { genresCount[g] = (genresCount[g] || 0) + 1; });
                agesCount[m.age || 'Not Rated'] = (agesCount[m.age || 'Not Rated'] || 0) + 1;

                if (m.rating !== null && m.rating !== undefined) {
                    if (m.rating >= 80) ratingsCount['High (80-100)']++;
                    else if (m.rating >= 60) ratingsCount['Medium (60-79)']++;
                    else ratingsCount['Low (<60)']++;
                } else {
                    ratingsCount['Unrated']++;
                }
            });

            // Top 8 genres
            const topGenres = Object.fromEntries(
                Object.entries(genresCount).sort((a,b) => b[1] - a[1]).slice(0, 8)
            );

            createOrUpdatePie('platformChart', platformsCount);
            createOrUpdatePie('genreChart', topGenres);
            createOrUpdatePie('ageChart', agesCount);
            createOrUpdatePie('ratingChart', ratingsCount);
        }

        function createOrUpdatePie(canvasId, dataObj) {
            const labels = Object.keys(dataObj);
            const data = Object.values(dataObj);

            if (charts[canvasId]) {
                charts[canvasId].data.labels = labels;
                charts[canvasId].data.datasets[0].data = data;
                charts[canvasId].data.datasets[0].backgroundColor = colors.slice(0, labels.length);
                charts[canvasId].update();
                return;
            }

            const ctx = document.getElementById(canvasId).getContext('2d');
            charts[canvasId] = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors.slice(0, labels.length),
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            });
        }

        function resetFilters() {
            document.getElementById('pie-country-select').value = 'ALL';
            filterByCountry('ALL');
        }

        function renderTable(movies) {
            document.getElementById('table-count').innerText = movies.length.toLocaleString();
            const tbody = document.getElementById('movieTableBody');
            const displayMovies = movies.slice(0, 500);

            tbody.innerHTML = displayMovies.map(m => `
                <tr class="hover:bg-gray-50 border-b">
                    <td class="p-3 font-semibold text-gray-900">${m.title}</td>
                    <td class="p-3 text-gray-500 font-mono">${m.year || '—'}</td>
                    <td class="p-3"><span class="px-2 py-0.5 bg-gray-100 text-gray-700 rounded text-3xs font-bold">${m.age}</span></td>
                    <td class="p-3 font-bold ${m.rating >= 80 ? 'text-green-600' : m.rating >= 60 ? 'text-blue-600' : 'text-amber-600'}">${m.rating !== null ? m.rating + '/100' : '—'}</td>
                    <td class="p-3 text-gray-600">${(m.genres || []).slice(0, 3).join(', ') || '—'}</td>
                    <td class="p-3">
                        ${(m.platforms || []).map(p => `<span class="inline-block px-1.5 py-0.5 mr-1 bg-blue-50 text-blue-700 rounded text-3xs">${p}</span>`).join('')}
                    </td>
                    <td class="p-3 text-gray-600">${(m.countries || []).slice(0, 2).join(', ') || 'Unknown'}</td>
                </tr>
            `).join('');

            if (movies.length > 500) {
                tbody.innerHTML += `<tr><td colspan="7" class="p-3 text-center text-gray-400">Showing first 500 of ${movies.length.toLocaleString()} titles...</td></tr>`;
            }
        }
    </script>
</body>
</html>
